interface:
  display_name: "Jong Coolify Deploy"
  short_description: "Deploy a local Git repository to a self-hosted Coolify VPS end to end"
  default_prompt: >
    Use $jong-coolify-deploy to deliver the current or named local repository
    to my self-hosted Coolify VPS. Inspect the repo and unrelated changes,
    use the Coolify REST API at my own instance domain, run repository-defined
    quality gates, add only minimal deployment configuration, publish only
    relevant source changes, choose Application versus Service, configure
    masked editable environment variables, persistence, health checks, domains
    and internal reachability, deploy to a terminal state, and verify logs,
    DNS, TLS, health and routes. Coolify MCP is optional.
    Never reveal secrets or delete resources, volumes, DNS records, or Git
    history without explicit approval. Return the URL, source commit, Coolify
    resource, verification evidence, rollback boundary and missing evidence.
  examples:
    - "把当前项目部署到我的 Coolify，域名用 risk.example.com"
    - "把这个 Docker Compose 项目一键发布到自有 VPS"
    - "本地没有 remote，创建私有 GitHub 仓库并部署到 Coolify"
    - "环境变量要在 Coolify UI 可编辑，数据卷需要持久化"
    - "Deploy this local repo to my self-hosted Coolify VPS and verify HTTPS"

compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills-compatible"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow read-only GitHub and Coolify inspection before scoped writes"
    generated_public_claims: "evidence-bound"
  permissions:
    network: "GitHub, configured Coolify instance, target application domains, and optional DNS provider"
    file_write: "deployment-related files in the target repository and this skill package only"
    subprocess: "git, gh, repository-defined quality commands, bundled API, inspection, smoke, and verification scripts"
    remote_write: "project-scoped GitHub/Coolify/DNS writes required by an explicit deployment request"
    interactive: "only when authentication or a destructive-conflict decision requires the user"
  degradation:
    api_unavailable: "stop remote writes, report the Coolify API health or authentication blocker, and keep local inspection results"
    mcp_unavailable: "continue through the Coolify REST API when it is healthy; MCP is optional"
    dns_write_unavailable: "deploy the resource and report the exact DNS record required"
    github_write_unavailable: "stop before source publication and report the authentication blocker"
    provider_evidence_unavailable: "label runtime claims as missing evidence"

gates:
  local:
    - "inspect project and unrelated changes"
    - "run relevant repository-defined test/lint/typecheck/build commands"
    - "scan tracked filenames for likely secrets"
  remote:
    - "Coolify REST API health"
    - "exact server/project/environment/resource identity"
    - "masked environment-variable handling"
    - "explicit persistence and healthcheck decision"
  completion:
    - "terminal deployment status"
    - "deployment logs checked"
    - "DNS and TLS verified"
    - "health and representative routes verified"
    - "rollback boundary reported"
